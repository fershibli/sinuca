name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux }
          - { os: windows-latest, platform: windows }
          - { os: macos-15-intel, platform: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile and package the jar
        shell: bash
        run: |
          mkdir -p build/classes dist
          javac --release 8 -encoding Cp1252 -d build/classes src/*.java
          jar cfe dist/Sinuca.jar Teste -C build/classes .
      - name: Native app image (bundles its own Java runtime)
        shell: bash
        run: |
          jpackage --type app-image --name Sinuca --input dist --main-jar Sinuca.jar --main-class Teste --dest build/app
          cd build/app && jar cfM "../../dist/Sinuca-${{ matrix.platform }}.zip" .
      - name: Keep the portable jar once
        if: matrix.platform != 'linux'
        shell: bash
        run: rm dist/Sinuca.jar
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.platform }}
          path: dist/*
  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
